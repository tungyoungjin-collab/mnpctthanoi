<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quan trắc Thủy văn - PCTT Hà Nội</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <img src="images/BHH40.jpg" alt="Logo">
        </div>

        <div class="title">
            <h1>HỆ THỐNG QUAN TRẮC MỰC NƯỚC - PCTT HÀ NỘI</h1>
            <p>Monitoring & Hydrological Data System</p>
        </div>

        <div class="user-info">Admin</div>
    </header>

    <!-- MENU -->
    <nav class="menu">
        <a href="#">Trang chủ</a>
        <a href="#">Bản đồ</a>
        <a href="#">Trạm đo</a>
        <a href="#">Biểu đồ</a>
        <a href="#">Báo cáo</a>
    </nav>

    <div class="color-strip"></div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="main-content">

        <section class="map-section">
            <h2>CÁC TRẠM ĐO MỰC NƯỚC PCTT HÀ NỘI</h2>
            <div id="windy"></div>
        </section>

        <section class="data-section">
            <h2>SỐ LIỆU QUAN TRẮC</h2>

            <div class="station-select">
                <label for="station">Chọn trạm:</label>
                <select id="station">
                    <option value="F01391">Trung Hà</option>
                    <option value="F01559">Thuỷ văn Hà Nội</option>
                    <option value="F01812">An Cảnh</option>
                    <option value="F01771">Liên Mạc</option>
                    <option value="F01540">Cầu Kim Quan</option>
                    <option value="F01254">TB Vĩnh Phúc</option>
                    <option value="F01532">TV Ba Thá</option>
                    <option value="F01223">Mạnh Tân</option>
                    <option value="F01215">Lương Phúc</option>
                    <option value="F01247">Yên Duyệt</option>
                    <option value="F01905">Đồng Quan</option>
                    <option value="F02031">Nhật Tựu</option>
                    <option value="F01238">TB Hoà Lạc</option>
                    <option value="F01828">TB Đình Thông</option>
                </select>
            </div>

            <div class="data-card">
                <div id="update-time">Cập nhật lúc: --</div>

                <div class="data-row">
                    <span>Trạng thái</span>
                    <strong id="station-status">--</strong>
                </div>

                <div class="data-row">
                    <span>Trạm</span>
                    <strong id="station-name">Hà Nội</strong>
                </div>

                <div class="data-row">
                    <span>Mực nước</span>
                    <strong id="water-level">125 cm</strong>
                </div>

                <div class="chart-card">
                    <h2>Biểu đồ mực nước</h2>

                    <div class="chart-filter">
                        <label for="timeFilter">Khoảng thời gian:</label>
                        <select id="timeFilter">
                            <option value="24" selected>24 giờ</option>
                            <option value="7">7 ngày</option>
                            <option value="15">15 ngày</option>
                            <option value="30">30 ngày</option>
                        </select>
                    </div>

                    <canvas id="waterChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>© 2026 Hệ thống Quan trắc Thủy văn</footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <script src="windy-map.js"></script>
    <script src="script36.js"></script>

</body>
</html>
